# routes the public share funnel port (:10000) to zipline or shlink.
# funnel clobbers x-forwarded-host, so routing is by path prefix: the vercel
# host-rewrites send i.* traffic to /zip/... and link.* to /lnk/..., and the
# trailing slash on proxy_pass strips the prefix before the apps see it.
server {
  listen 80;
  client_max_body_size 512m; # zipline uploads

  # i.tetraslam.world/a/<name>: zipline's raw file as a page that may run
  # scripts. zipline sends `csp: sandbox` (no scripts) on every raw file; this
  # swaps in a sandbox that allows scripts but not same-origin, so a page gets
  # an opaque origin and cannot use zipline's cookies or api. used by the
  # dotagents opencode artifacts plugin.
  location /zip/a/ {
    proxy_pass http://zipline:3000/raw/;
    proxy_set_header Host i.tetraslam.world;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host i.tetraslam.world;
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "sandbox allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms allow-modals allow-downloads" always;
  }

  location /zip/ {
    proxy_pass http://zipline:3000/;
    proxy_set_header Host i.tetraslam.world;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host i.tetraslam.world;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /lnk/ {
    proxy_pass http://shlink:8080/;
    proxy_set_header Host link.tetraslam.world;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host link.tetraslam.world;
  }

  location / {
    return 404;
  }
}
